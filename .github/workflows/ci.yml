name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CPU-only and offline. MPS and model-download tests are excluded by marker; a skipped
# MPS test is not evidence of MPS support, so they are simply not run here.
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type check
        run: python -m mypy src/evallens

      - name: Environment self-test
        run: evallens doctor

      - name: Tests
        run: python -m pytest -m 'not mps and not download' -q
